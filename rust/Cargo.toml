[workspace]
resolver = "2"
members = ["filedrop-core", "filedrop-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["FileDrop Contributors"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
sha2 = "0.11"
sled = "0.34"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
mdns-sd = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rand = "0.10"
base64 = "0.23"
futures = "0.3"
bytes = "1.9"
tokio-util = { version = "0.7", features = ["io"] }
if-addrs = "0.15"

[profile.release]
opt-level = 3
lto = true
